<!doctype html>
<meta charset="utf-8">
<title>fchain-wgsl</title>
<!-- .agents/slop/browser/web/fchain-wgsl.html -- THE PRE-RENDERED LANE: the four modules come from
     `fchain-wgsl.rows` (rendered by `fchainwgsl.bend` ahead of time) and are dispatched as-is.
     The live lane is `fchain-wgsl-live.html`, which renders them IN THE PAGE. -->
<script type="module">
import { runStages } from "./fchain-run.js";
const done = (o) => { window.__FCHAIN_RESULT = o; document.title = "done"; };
const seed = await (await fetch("fchain-seed.json")).json();
const mods = await (await fetch("fchain-modules.json")).json();
runStages({ modules: mods.modules, wiring: seed.wiring, seed: seed.seed }, done)
  .catch((e) => done({ ok: false, error: String(e && e.stack || e) }));
</script>
